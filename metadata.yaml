# This file stores settings for your Flutter application

# Application metadata
app_name: Time Flap
package_name: com.timeflap.app
version: 1.0.0
build_number: 1

# Supported platforms
platforms:
  android: true
  ios: true

# Features
features:
  - countdown_timer
  - pomodoro_timer
  - task_timer
  - light_dark_mode
  - color_schemes
  - wakelock
  - screen_saver

# Requirements
min_sdk_version: 21
target_sdk_version: 34
